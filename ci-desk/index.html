  --paper: #ffffff;
  --paper-fg: #111111;
  --font-body: "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", "Consolas", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --panel: #19212a; --sunk: #222c37; --line: #33404e; --fg: #e5ebf1; --muted: #9aa8b8;
  --accent: #8fb3f5; --accent-soft: #22324d; --ok: #6fd09c; --ok-soft: #173326; --warn: #f0b85c; --warn-soft: #3a2c12;
  --bad: #ff9d94; --bad-soft: #43201d; --paper: #f7f7f5; --paper-fg: #111111; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161c; --panel: #19212a; --sunk: #222c37; --line: #33404e; --fg: #e5ebf1; --muted: #9aa8b8;
  --accent: #8fb3f5; --accent-soft: #22324d; --ok: #6fd09c; --ok-soft: #173326; --warn: #f0b85c; --warn-soft: #3a2c12;
  --bad: #ff9d94; --bad-soft: #43201d; --paper: #f7f7f5; --paper-fg: #111111; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num, td.n, th.n { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
td.n, th.n { text-align: right; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 17px; letter-spacing: .02em; }
.brand span { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.tab:hover { background: var(--sunk); color: var(--fg); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.conn { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--ok); } .dot.off { background: var(--warn); }

main { padding-block: 20px 60px; }
h1 { font-size: 20px; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; margin: 0 0 10px; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spread { justify-content: space-between; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.stack { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }

/* controls */
label.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 54px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input.n { font-family: var(--font-num); text-align: right; }
.btn { font: inherit; font-weight: 500; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--sunk); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.grid .wide { grid-column: 1 / -1; }

/* pills */
.pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.draft { background: var(--sunk); color: var(--muted); }
.pill.review { background: var(--warn-soft); color: var(--warn); }
.pill.issued { background: var(--accent-soft); color: var(--accent); }
.pill.shipped { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.good { background: var(--ok-soft); color: var(--ok); }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--sunk); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--sunk); }
tr.over td { background: var(--bad-soft); }
tfoot td { font-weight: 600; background: var(--sunk); }

/* editor */
.ed { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: grid; gap: 12px; }
@media (max-width: 960px) { .ed { grid-template-columns: minmax(0, 1fr); } .side { position: static; } }
.modes { display: grid; gap: 6px; }
.mode { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.mode input { width: auto; margin-top: 4px; }
.mode.sel { border-color: var(--accent); background: var(--accent-soft); }
.mode small { display: block; color: var(--muted); font-size: 12px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.kv dd.big { font-size: 18px; font-weight: 600; color: var(--fg); }

.item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; background: var(--panel); }
.item-h { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.item-h b { font-family: var(--font-num); }
.item .grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.calc { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; padding: 8px 10px; background: var(--sunk); border-radius: 6px; }
.calc span b { font-family: var(--font-num); font-weight: 600; }
.warns { display: grid; gap: 4px; }
.warn { font-size: 12px; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 3px 8px; }
.warn.bad { color: var(--bad); background: var(--bad-soft); }
details.ov summary { cursor: pointer; font-size: 12px; color: var(--accent); }
details.ov .grid { margin-top: 8px; }

/* document preview — always paper */
.paper { background: var(--paper); color: var(--paper-fg); border: 1px solid var(--line); border-radius: 4px; padding: 28px; overflow-x: auto; font-size: 12px; }
.paper table { min-width: 640px; }
.paper th, .paper td { border: 1px solid #222; padding: 4px 6px; color: #111; background: transparent; }
.paper th { background: #eee; color: #111; }
.paper .co { text-align: center; font-weight: 700; font-size: 15px; }
.paper .addr { text-align: center; font-size: 11px; }
.paper .doc-t { text-align: center; font-weight: 700; font-size: 18px; letter-spacing: .08em; margin: 10px 0; }
.paper .hd td:first-child { width: 150px; font-weight: 600; }
.paper .sm-lines div { white-space: pre-wrap; }
.paper .n { text-align: right; font-family: var(--font-num); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); color: var(--muted); font: inherit; padding: 5px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.drop { display: grid; gap: 2px; justify-items: center; text-align: center; padding: 16px; border: 1.5px dashed var(--line); border-radius: 8px; cursor: pointer; background: var(--sunk); }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 20; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--bad); }
@media (prefers-reduced-motion: no-preference) { .btn, .tab, .mode { transition: background .12s, border-color .12s; } }

.ov { --o-card: rgba(255,255,255,.045); --o-line: rgba(255,255,255,.09); --o-fg: #e8eaf6; --o-mute: #8b93b8; --o-cyan: #22d3ee;
  color: var(--o-fg); background: radial-gradient(1200px 640px at 50% 32%, #2a1a66 0%, #0e1133 45%, #070916 100%);
  border-radius: 16px; padding: 20px; display: grid; gap: 16px; overflow: hidden; }
.ov h1 { color: #fff; font-size: 24px; }
.ov h2 { color: #fff; font-size: 15px; margin: 0 0 4px; }
.ov-kicker { font-size: 11px; letter-spacing: .18em; color: var(--o-cyan); font-weight: 600; }
.ov-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.ov-seg { display: inline-flex; background: var(--o-card); border: 1px solid var(--o-line); border-radius: 99px; padding: 3px; }
.ov-seg button { border: 0; background: none; color: var(--o-mute); font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 99px; cursor: pointer; }
.ov-seg button[aria-pressed="true"] { background: linear-gradient(90deg, #7c3aed, #db2777); color: #fff; }
.ov-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.ov-col { display: grid; gap: 16px; min-width: 0; }
.ov-card { background: var(--o-card); border: 1px solid var(--o-line); border-radius: 14px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); min-width: 0; animation: ovIn .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); }
.ov-lbl { font-size: 12px; color: var(--o-mute); display: flex; justify-content: space-between; gap: 8px; }
.ov-big { font-family: var(--font-num); font-size: 30px; font-weight: 700; color: #fff; margin-top: 4px; overflow-wrap: anywhere; line-height: 1.15; }
.ov-big small { font-size: 14px; color: var(--o-mute); font-weight: 500; }
.ov-up { color: #4ade80; font-size: 12px; font-weight: 600; }
.ov-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 132px; overflow: auto; margin-top: 10px; }
.ov-chip { font-family: var(--font-num); font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid rgba(34,211,238,.35); color: #a5f3fc; background: rgba(34,211,238,.08); cursor: pointer; }
.ov-chip:hover { background: rgba(34,211,238,.22); }
.ov-globe { position: relative; min-width: 0; animation: ovIn .9s cubic-bezier(.2,.8,.2,1) both; }
.ov-globe canvas { width: 100%; max-width: 560px; margin: 0 auto; aspect-ratio: 1; display: block; touch-action: none; cursor: grab; }
.ov-globe canvas:active { cursor: grabbing; }
.ov-origin { display: flex; align-items: center; gap: 10px; margin: 0 auto; max-width: 460px; background: rgba(10,12,35,.7); border: 1px solid rgba(74,222,128,.35); border-radius: 12px; padding: 8px 12px; }
.ov-origin b { color: #fff; font-size: 13px; display: block; }
.ov-origin span { color: var(--o-mute); font-size: 11px; }
.ov-live { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; flex: none; animation: ovPulse 1.8s infinite; }
.ov-gfoot { text-align: center; font-size: 12px; color: var(--o-mute); }
.ov-dest { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--o-line); }
.ov-dest:first-of-type { border-top: 0; }
.ov-code { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; border: 2px solid; background: rgba(255,255,255,.04); }
.ov-dest b { color: #fff; font-size: 13px; }
.ov-dest .sub { color: var(--o-mute); font-size: 11px; }
.ov-dest .n { font-family: var(--font-num); text-align: right; font-size: 13px; color: #fff; }
.ov-bar { grid-column: 2 / 4; height: 6px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
.ov-bar i { display: block; height: 100%; border-radius: 99px; animation: ovGrow 1.3s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); }
.ov-rings { display: grid; gap: 12px; }
.ov-mode { display: flex; align-items: center; gap: 12px; }
.ov-mode b { color: #fff; font-size: 13px; display: block; }
.ov-mode span { color: var(--o-mute); font-size: 12px; font-family: var(--font-num); }
.ov-ringw { position: relative; width: 70px; height: 70px; flex: none; }
.ov-ringw em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-family: var(--font-num); font-weight: 700; font-size: 14px; color: #fff; }
.ov-ring { width: 70px; height: 70px; transform: rotate(-90deg); }
.ov-ring circle { fill: none; stroke-width: 7; }
.ov-ring .trk { stroke: rgba(255,255,255,.08); }
.ov-ring .val { stroke-linecap: round; stroke-dasharray: 100; animation: ovRing 1.5s cubic-bezier(.2,.8,.2,1) both; }
.ov-spark { width: 100%; height: 96px; display: block; margin-top: 8px; overflow: visible; }
.ov-spark .ln { fill: none; stroke-width: 2.5; stroke-dasharray: 1; animation: ovDraw 1.8s ease-out both; }
.ov-spark .ar { animation: ovFade 1.8s ease-out both; }
.ov-spark text { fill: var(--o-mute); font-size: 9px; }
.ov-wbar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.07); margin-top: 12px; }
.ov-wbar i { display: block; height: 100%; animation: ovGrow 1.4s cubic-bezier(.2,.8,.2,1) both; }
.ov-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--o-mute); }
.ov-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.ov .tbl-wrap { background: transparent; border-color: var(--o-line); }
.ov table th { background: rgba(255,255,255,.03); color: var(--o-mute); border-color: var(--o-line); }
.ov table td { border-color: var(--o-line); color: var(--o-fg); }
.ov table tr.click:hover td { background: rgba(124,58,237,.18); }
.ov-empty { text-align: center; color: var(--o-mute); padding: 6px 0; font-size: 13px; }
@keyframes ovIn { from { opacity: 0; transform: translateY(14px); } }
@keyframes ovGrow { from { width: 0; } }
@keyframes ovRing { from { stroke-dashoffset: 100; } }
@keyframes ovDraw { from { stroke-dashoffset: 1; } }
@keyframes ovFade { from { opacity: 0; } }
@keyframes ovPulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.7); } 100% { box-shadow: 0 0 0 12px rgba(74,222,128,0); } }
@media (max-width: 1000px) { .ov-grid { grid-template-columns: minmax(0, 1fr); } .ov-globe { order: -1; } }
@media (max-width: 520px) { .ov { padding: 14px; border-radius: 12px; } .ov-big { font-size: 24px; } }
@media (prefers-reduced-motion: reduce) { .ov * { animation: none !important; } }

body { overflow-x: clip; }
.brand { align-items: center; cursor: pointer; }
.brand i { width: 58px; height: 34px; flex: none; background: var(--logo) center / contain no-repeat; }
.brand b { font-size: 16px; color: var(--accent); }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.who .me { color: var(--fg); font-weight: 500; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
body:not(.signed-in) .tab[data-view="account"] { display: none; }
body.portal .tabs .tab:not([data-view="home"]):not([data-view="account"]):not([data-view="links"]) { display: none; }
body:not(.portal) .tab[data-view="links"], body:not(.signed-in) .tab[data-view="links"] { display: none; }
.cards.center { grid-template-columns: repeat(auto-fit, minmax(230px, 300px)); justify-content: center; }
body.ci-only .tab[data-view="home"] { display: none; }
.gate { max-width: 440px; margin: 64px auto; text-align: center; display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; }
.gate .lg-logo { height: 96px; background: var(--logo) center / contain no-repeat; }
.gate .btn { justify-self: center; padding: 9px 28px; font-size: 15px; }
body.signed-out .tabs .tab:not([data-view="home"]) { display: none; }

#v-home { margin-top: -20px; gap: 0; }
.bleed { margin-inline: calc(50% - 50vw); padding-inline: max(24px, calc(50vw - 652px)); }
.hh { position: relative; min-height: 520px; display: grid; align-items: center; color: #fff; overflow: hidden; background: radial-gradient(120% 90% at 75% 40%, #12306e 0%, #071330 60%, #030814 100%); }
.hh svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hh .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(3,8,20,.9) 0%, rgba(3,8,20,.55) 45%, rgba(3,8,20,.1) 100%); }
.hh-txt { position: relative; max-width: 620px; padding-block: 56px; animation: ovIn .7s ease both; }
.hh-logo { display: block; width: 150px; height: 88px; margin-bottom: 14px; background: var(--logo) left center / contain no-repeat; filter: brightness(0) invert(1); }
.hh-kick { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #9cc0ff; margin: 0 0 8px; }
.hh h1 { font-size: clamp(28px, 5vw, 46px); line-height: 1.15; margin: 0 0 14px; }
.hh p.lead { font-size: 16px; color: #d6e2f7; margin: 0 0 24px; max-width: 54ch; }
.hh .btn { padding: 10px 20px; font-size: 15px; border-radius: 99px; }
.hh .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
.hh .btn.ghost:hover { background: rgba(255,255,255,.1); }
.hh .btn.pri { background: #3f74ff; border-color: #3f74ff; color: #fff; }
.route { fill: none; stroke: #7fb2ff; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 8 10; opacity: .85; animation: dashMove 1.6s linear infinite; }
.route-dot { fill: #fff; filter: drop-shadow(0 0 6px #7fb2ff); }
.origin { fill: #4ade80; } .origin-ring { fill: none; stroke: #4ade80; stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: ring 2.2s ease-out infinite; }
.dest { fill: #ffd27a; }
@keyframes dashMove { to { stroke-dashoffset: -36; } }
@keyframes ring { from { transform: scale(.4); opacity: 1; } to { transform: scale(3); opacity: 0; } }

.band { background: linear-gradient(135deg, #1f4fa3, #2f6fd6); color: #fff; text-align: center; padding-block: 56px; }
.band h2 { font-size: 26px; margin: 0 0 14px; }
.band p { max-width: 760px; margin: 0 auto 22px; font-size: 15px; line-height: 1.8; color: #e6eeff; }
.band .btn { border-radius: 99px; padding: 9px 22px; background: #0b1d4d; border-color: #0b1d4d; color: #fff; }
.hsec { padding-block: 48px 8px; }
.hsec > h2 { font-size: 24px; text-align: center; margin: 0 0 6px; color: var(--accent); }
.hsec > .sub { text-align: center; margin: 0 auto 24px; max-width: 60ch; }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.hcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 8px; align-content: start; transition: transform .2s, box-shadow .2s; }
.hcard h3 { font-size: 16px; margin: 0; }
.hcard p { margin: 0; color: var(--muted); font-size: 13px; }
.hcard .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.hcard .ic svg { width: 24px; height: 24px; }
a.hcard, button.hcard { color: inherit; text-decoration: none; text-align: left; font: inherit; cursor: pointer; }
a.hcard:hover, button.hcard:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(15, 40, 90, .14); border-color: var(--accent); }
.hcard .go { font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 4px; }
.hcard .url { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.mission { margin-top: 40px; border-radius: 16px; padding: 28px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.mission h3 { margin: 0 0 6px; color: var(--accent); font-size: 17px; }
.mission p { margin: 0; white-space: pre-line; }
.hfoot { margin-top: 40px; padding-block: 20px; text-align: center; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }

.lg-back { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(5, 12, 30, .6); backdrop-filter: blur(4px); }
.lg-card { width: min(400px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto;background: var(--panel); border-radius: 16px; padding: 26px 24px; display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.35); animation: ovIn .3s ease both; }
.lg-card .lg-logo { height: 84px; background: var(--logo) center / contain no-repeat; }
.lg-card h2 { text-align: center; margin: 0; font-size: 18px; }
.lg-card .sub { text-align: center; margin: -6px 0 4px; }
.lg-card .btn.pri { padding: 9px; font-size: 15px; }
.lg-err { color: var(--bad); font-size: 13px; min-height: 1em; margin: 0; }
.acc .tbl-wrap td { vertical-align: middle; }
.acc .linkrow { display: grid; gap: 8px; grid-template-columns: minmax(120px, 1fr) minmax(160px, 1.4fr) minmax(140px, 1.4fr) auto; align-items: end; }
@media (max-width: 700px) { .acc .linkrow { grid-template-columns: minmax(0, 1fr); padding-bottom: 10px; border-bottom: 1px dashed var(--line); } .hh { min-height: 460px; } }
